/><path d="M95 156Q350 248 466 342T367 578" stroke="#e3d8ac" stroke-width="6" stroke-dasharray="7 4" fill="none"/>${trees}<path d="m781 407 61 7v34l-61-7z" fill="#ba775d"/><path d="m772 407 36-23 46 27-61-5z" fill="#7b503f"/><path d="m794 431 12 2v12l-12-2z" fill="#f3e3b7"/><path d="m824 422 9 1v10l-9-1z" fill="#eddca6"/><path d="M0 0H540Q516 199 400 311L0 280Z" class="snow" fill="#f4f5ed"/>`;}

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=0)=>v===null||v===undefined?'–':Number(v).toLocaleString('nb-NO',{minimumFractionDigits:d,maximumFractionDigits:d});

const MISSIONS=[
 {title:'Hvor stor er bestanden?',question:'Flere observasjoner. Flere hjort?',task:'Tolk tre tidligere jaktår. Velg undersøkelser og skriv et begrunnet utgangspunkt for bestandsplanen.',goal:'Skille en observasjonsindeks fra et bestandsantall.',steps:['Les utviklingen i jaktloggene.','Velg datakort og plasser feltbasen på kartet.','Svar på vurderingen og skriv en kort anbefaling.'],clue:'Sett hjort per jegerdag kan endres når bestanden, oppdagbarheten eller jaktpraksisen endres. Ett tall er ikke en telling av hele bestanden.'},
 {title:'Vinterbeite og sesongtrekk',question:'Hvem bruker vinterbeitet?',task:'Fordel fem tiltakspoeng mellom tryggere veikryssing, vinterro og merkedata. Tiltakene følger kampanjen.',goal:'Prioritere et tiltak der det møter hjortens arealbruk.',steps:['Les områdene på kartet.','Plasser kort innenfor rammen på fem poeng.','Forklar hvorfor tiltaket bør ligge akkurat der.'],clue:'Nordlia er høyt sommerbeite, Sørskogen er lavt vinterbeite. Noen hjort blir i samme område; andre trekker, også over kartgrensen.'},
 {title:'Hjort, skog og jordbruk',question:'Hvem bærer kostnaden?',task:'Velg tiltak mot beiteskader. Gårdbrukeren vil sikre avlingen, skogeieren vil få opp ungskog, og hjorten trenger beite.',goal:'Begrense skader og samtidig vurdere kostnader og følgevirkninger.',steps:['Les grunneiernes meldinger.','Fordel fire poeng på arealtiltak eller skademåling.','Noter en forventet gevinst og en mulig ulempe.'],clue:'Gjerder rundt utsatte jorder kan flytte noe av beitingen. Bedre naturlig beite kan både redusere beitepresset lokalt og øke kalveproduksjonen.'},
 {title:'Lag en bestandsplan',question:'Ett uttak. Fem års følger.',task:'Lag en foreløpig femårsplan. Følg ett jaktår av gangen og revider de gjenstående årene med nye data.',goal:'Balanser bestand, kalveandel, kjønnssammensetning, skader og trafikk.',steps:['Fordel årets planlagte uttak på fem dyregrupper.','Kontroller rammer og jaktinnsats; begrunn valget.','Spill året, les årsrapporten og juster neste år.'],clue:'Årets tildeling er et tak, ikke et mål om å felle flest mulig. Den samme kvoten kan bli for høy når bestanden og sammensetningen endres.'}

let game=null,screen='',selected='',zone='n',notice='',playing=false,raf=null,lastTick=null,pauseReason='',resetPrompt=false;
try{const saved=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(saved?.version===3&&Array.isArray(saved.world)&&Array.isArray(saved.plans)&&saved.plans.length===5&&saved.year>=1&&saved.year<=5){game=saved;if(game.phase==='play')pauseReason='Lagret avspilling. Trykk Fortsett for å spille videre.';}}catch(e){}
function save(){if(!game)return;try{localStorage.setItem(STORE_KEY,JSON.stringify(game));$('#saved').textContent='Lagret i denne nettleseren';$('#storageWarning').hidden=true;}catch(e){$('#saved').textContent='Ikke lagret';$('#storageWarning').hidden=false;$('#storageWarning').textContent='Nettleseren tillater ikke lagring her. Behold fanen åpen og last ned rapporten for å ta vare på notatene.';}}
function announce(text){$('#announcer').textContent=text;}
const noteKey=()=>game.stage===3?'year'+game.year:'mission'+game.stage;
function noteBox(){const k=noteKey();return `<section class="panel notebook"><div class="section-head"><h3>Din forvaltningslogg</h3><span class="tag">Blir med i sluttrapporten</span></div><label for="note">${game.stage===3?'Hva bygger uttaket på, og hva vil du følge ekstra nøye?':'Hva anbefaler du for Fjellvik – og hvorfor?'}</label><textarea id="note" rows="4" placeholder="Skriv stikkord eller en kort begrunnelse …">${esc(game.notes[k]||'')}</textarea><p class="small muted">Notatene lagres underveis. Åpne «Rapport og notater» for å samle eller laste dem ned.</p><details><summary>Tips og svarforslag</summary><p>${[ 'Observasjonene øker, mens kalv per kolle synker og kolle per bukk stiger. Det taler for å undersøke både bestandstrend, reproduksjon og kjønnssammensetning. Avklar jaktinnsats og oppdagbarhet før du tolker endringene som ren bestandsvekst.', 'Knytt tiltaket til en rute eller et leveområde. Passasje ved veien kan redusere trafikkrisiko. Ro i et mye brukt vinterområde kan bedre overlevelsen. GPS gir informasjon om et utvalg dyr; uten merkedata er sesongtrekket mer usikkert.', 'Beskriv både mottaker og følgevirkning: vern av innmark hjelper gårdbrukeren, men kan flytte beitingen. Beskyttelse av ungskog reduserer lokale skader. Beiteskjøtsel virker senere og kan øke reproduksjonen. Det finnes flere forsvarlige kombinasjoner.', 'Bruk bestandsintervallet, flere års sett hjort, kalveandel og kjønnsforhold sammen. Vurder lavere uttak hvis bestanden trolig faller under målområdet. Mange felte koller kan dempe kommende kalveproduksjon. Et høyt bukkuttak kan gjøre kjønnsforholdet skjevere.' ][game.stage]}</p><p class="small muted">Dette er støtte til egen vurdering, ikke automatisk vurdering av teksten din.</p></details></section>`;}
function intro(){return `<section class="hero"><div><p class="kicker">Hjorteforvaltning · spillversjon 3.2</p><h1>Du velger tiltak.<br>Landskapet svarer.</h1><p class="lead">Fem år i Fjellvik. Hjorten følger årstidene. Grunneierne har ulike mål. Og du må ta beslutninger før du vet alt.</p><p>Forvalt en hjortebestand med usikre data, begrensede tiltaksmidler og en jaktplan du kan lære av.</p><div class="pills"><span>Fire oppdrag</span><span>Fem jaktår</span><span>Uten tidspress</span></div>${btn('Ta over Fjellvik →','start','gold')}<p class="small muted intro-hint">Omtrent 30–45 minutter. Spill alene eller diskuter valgene i et lag. Kan brukes uten nettilkobling.</p></div><figure class="hero-photo"><img src="${PHOTO}" alt="Hjort i snø, med en bukk i forgrunnen. Foto: Bjørn Aksel Bjerke"><figcaption>Hjort · <i>Cervus elaphus</i><span>Foto: Bjørn Aksel Bjerke</span></figcaption><div class="photo-label">Ikke flest mulig hjort.<br><b>En bestand i balanse med landskapet.</b></div></figure></section><div class="intro-grid"><article><span class="chapter">01 / 02</span><h3>Les tegnene. Velg sted.</h3><p>Undersøk observasjonene og planlegg vintertiltak. Kartet viser prosessene; symbolene er ikke en telling.</p></article><article><span class="chapter">03 / 04</span><h3>Fordel kostnader og uttak.</h3><p>Beskytt innmark og ungskog. Lag en plan for kalv, ungdyr og voksne hjort.</p></article><article><span class="chapter">ÅR 1 → 5</span><h3>La valgene få følger.</h3><p>Følg jakta, brunsten, trekket og kalvingen. Prøv et år på nytt med samme vær og andre valg.</p></article></div><div class="callout"><b>Et fiktivt bestandsplanområde.</b> Alle lokale tall, mål, kostnader og modellrater er konstruert for læring. Faggrunnlaget er hentet fra hjorteforskning og norsk forvaltning. Du får ikke en kvoteanbefaling for et virkelig område.</div>`;}
function briefing(){const m=MISSIONS[game.stage];return `<section class="brief panel"><p class="kicker">Oppdrag ${game.stage+1} av 4${game.stage===3?' · femårskampanjen':' · før første jaktår'}</p><h1>${m.question}</h1><p class="lead">${m.task}</p><div class="goal"><span class="kicker">Dette skal du få til</span><p>${m.goal}</p></div><div class="brief-grid"><div><h3>Gjør dette</h3><ol>${m.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div><aside><h3>Ha dette i bakhodet</h3><p>${m.clue}</p><p class="small muted">Du kan lese oppdraget på nytt når som helst. Det er ingen nedtelling.</p></aside></div><div class="actions">${btn('Jeg har oppdraget – åpne kartet →','briefDone','gold')}</div></section>`;}
function campaignTop(){return `<div class="campaign-top"><div><p class="kicker">${game.stage<3?'Før første jaktår':`Jaktår ${game.year} av 5`}</p><h1>${MISSIONS[game.stage].title}</h1></div><ol class="steps" aria-label="Fremdrift">${MISSIONS.map((m,i)=>`<li class="${i===game.stage?'active':i<game.stage?'done':''}" title="${m.title}" ${i===game.stage?'aria-current="step"':''}>${i<game.stage?'✓':i+1}</li>`).join('')}</ol></div>`;}
function cardDeck(){const budget=BUDGETS[game.stage],spent=cost(game.actions,game.stage);return `<div class="resource"><b>${budget-spent} av ${budget} poeng igjen</b><span>Varige avtaler i fem år</span></div><div class="deck">${Object.entries(CARDS).filter(([k,c])=>c.stage===game.stage).map(([k,c])=>`<button class="action-card ${selected===k?'active':''} ${game.actions[k]?'placed':''}" data-card="${k}" aria-pressed="${selected===k}"><span class="card-icon">${icon(c.icon)}</span><span><strong>${game.actions[k]?'✓ ':''}${c.name}</strong><small>${c.desc}</small></span><span class="cost">${c.cost} p</span></button>`).join('')}</div>${selected?`<div class="selected-tip"><b>${CARDS[selected].name}</b><p>${CARDS[selected].effect}</p><p>Velg et markert sted på kartet${game.actions[selected]?' for å flytte kortet':''}.</p></div>`:'<p class="small muted deck-hint">Velg et kort, og trykk deretter på et markert sted i kartet. Du kan fjerne kort før du går videre.</p>'}<div class="placed-list">${Object.entries(game.actions).filter(([k])=>CARDS[k].stage===game.stage).map(([k,z])=>`<div><span>${CARDS[k].name}<small>${ZONES[z].name}</small></span><button class="remove" data-remove="${k}" aria-label="Fjern ${CARDS[k].name}">Fjern</button></div>`).join('')}</div>`;}
function indicesTable(){const rows=[...HISTORIC,...game.history.map(r=>r.sightings)];return `<section class="panel"><div class="section-head"><h3>Jaktloggene</h3><span class="tag">Konstruerte feltdata</span></div><div class="table-scroll"><table><caption>Relativ bestandsutvikling og jaktinnsats</caption><thead><tr><th>Jaktår</th><th>Sett / jegerdag</th><th>Felt / jegerdag</th><th>Kalv / kolle</th><th>Kolle / bukk</th><th>Jegerdager</th></tr></thead><tbody>${rows.map(r=>`<tr><th>${r.label}</th><td>${num(r.seen,2)}</td><td>${num(r.shot,2)}</td><td>${num(r.calf,2)}</td><td>${num(r.sex,2)}</td><td>${r.effort}</td></tr>`).join('')}</tbody></table></div><p class="small muted">Samme hjort kan observeres flere ganger. «Sett» teller observasjonshendelser, ikke unike dyr. En jegerdag er én jeger som deltar én dag. Kalv per kolle og kolle per bukk omfatter observerte dyr; koller og bukker her inkluderer ungdyr.</p>${game.actions.audit?'<div class="feedback good"><b>Jaktloggene er kontrollert.</b> Innsats, jaktdatoer, jaktform og rapporteringsrutiner var sammenlignbare i de tre tidligere årene. Økningen er derfor mer interessant, men endret sikt og arealbruk kan fortsatt påvirke observasjonene.</div>':''}</section>`;}
function estimatePanel(){const o=game.obs;return `<section class="panel"><div class="section-head"><h3>Et anslag, ikke en opptelling</h3><span class="tag">${o.rich?'Utvidet prøveundersøkelse':'Enkel prøveundersøkelse'}</span></div><div class="estimate"><strong>${o.estimate}</strong><span>anslåtte hjort i Fjellvik<br><b>Arbeidsintervall ${o.lo}–${o.hi}</b></span></div><p>Intervallet viser usikkerheten i hvor mange dyr som ble oppdaget og hvor stor andel undersøkelsen fanget opp. Det er et <b>illustrativt arbeidsintervall</b>, ikke et beregnet 95 % konfidensintervall.</p><details><summary>Hvor kommer tallene fra?</summary><p>Spillet har en skjult bestand. Den brukes til å simulere ufullstendige observasjoner, på samme måte som hjort kan bli oversett i felt. Det er de simulerte observasjonene – sammen med et usikkert anslag for oppdagbarhet – som brukes i bestandsanslaget.</p><div class="table-scroll"><table><thead><tr><th>Område</th><th>Unike dyr per tellenatt</th><th>Anslått oppdagbarhet</th><th>Arbeidsintervall</th></tr></thead><tbody>${Object.entries(o.zones).map(([z,v])=>`<tr><th>${ZONES[z].name}</th><td>${v.counts.join(' / ')}</td><td>${num(v.p*100)} %</td><td>${v.lo}–${v.hi}</td></tr>`).join('')}</tbody></table></div><p>Enkelt forklart: Hvis omtrent halvparten blir oppdaget, tilsvarer 50 observerte dyr et anslag rundt 100. Modellen bruker <b>gjennomsnittlig antall observert ÷ anslått oppdagbarhet</b>, separat for hvert område. Resultatet blir ikke eksakt, selv med flere tellenetter.</p><p class="small muted">Dette er en egen, konstruert prøveundersøkelse. Sett hjort per jegerdag kan ikke alene omregnes til antall hjort med denne formelen. Merkekortet gir trekkdata og endrer ikke dette intervallet.</p></details></section>`;}
function assessment(){const answer=game.answers.trend;return `<fieldset class="quiz"><legend>Hva vil du si til en medstudent om de tre tidligere årene?</legend>${[
 ['growth','Bestanden har økt i samme prosent som sett hjort per jegerdag. Kalveandelen kan vurderes etterpå.'],
 ['nuance','Tallene tyder på økning, men vi må kontrollere innsats og oppdagbarhet og følge den fallende kalveandelen.'],
 ['stable','Flere koller per bukk forklarer hele økningen, så den samlede bestanden er trolig uendret.']
].map(([id,text])=>`<label class="choice"><input type="radio" name="trend" value="${id}" ${answer===id?'checked':''}> <span>${text}</span></label>`).join('')}</fieldset>${answer?`<div class="feedback ${answer==='nuance'?'good':'hint'}" role="status">${answer==='nuance'?'<b>Godt begrunnet.</b> Indeksene gir grunn til å undersøke vekst, samtidig som reproduksjon og kjønnssammensetning krever oppmerksomhet.':answer==='growth'?'<b>Se på antakelsen om proporsjonal vekst.</b> Flere observasjoner kan også skyldes bedre sikt eller endret arealbruk. Kalveandel og kjønnsforhold gir viktig tilleggsinformasjon.':'<b>Det vet vi ikke.</b> Kjønnsforholdet beskriver sammensetningen, men forklarer ikke alene hvor mange hjort som finnes. Sammenlign flere indikatorer og undersøk datakvaliteten.'}</div>`:''}`;}
function stakeholders(){return `<section class="panel"><h3>Tre hensyn i samme landskap</h3><div class="stakeholder"><b>Gårdbrukeren · Elvesletta</b><p>«Vi trenger mer av grasavlingen. Kan dere skjerme de mest utsatte jordene?»</p></div><div class="stakeholder"><b>Skogeieren · Sørskogen</b><p>«Ungtrærne må få vokse. Flyttes beitingen hit, hjelper det lite at skaden går ned på jordene.»</p></div><div class="stakeholder"><b>Bestandsplanområdet</b><p>«Vi må sikre sammenhengende leveområder og en bestand med god rekruttering. Tiltaksmidlene rekker ikke til alt.»</p></div><div class="callout small">Du prioriterer fire poeng nå. Virkningen måles i prøvefelt gjennom de fem jaktårene. Det finnes ikke ett kort som løser alle konfliktene.</div></section>`;}
function planPanel(){const p=game.plans[game.year-1],o=game.obs;return `<p class="kicker">Avskytingsplan · år ${game.year}</p><h2>Hva vil du ta ut?</h2><p>Årets tildeling i scenariet: <b>100 dyr</b>. Planlegg innenfor rammene nedenfor. Det er lov å planlegge færre.</p><div class="plan-total"><strong>${sum(p)} <small>dyr planlagt</small></strong><span>${100-sum(p)} av årets tillatelser<br>ikke lagt inn i planen</span></div><div class="quota-list">${KEYS.map(k=>`<div class="quota-row"><label for="quota-${k}"><strong>${GROUPS[k]}</strong><small>${AGES[k]} · ramme ${LIMITS[k]}</small></label><div class="stepper"><button data-adjust="${k}" data-delta="-5" aria-label="Fem færre ${GROUPS[k].toLowerCase()}">−5</button><input id="quota-${k}" type="number" min="0" max="${LIMITS[k]}" step="1" value="${p[k]}" inputmode="numeric"><button data-adjust="${k}" data-delta="5" aria-label="Fem flere ${GROUPS[k].toLowerCase()}">+5</button></div></div>`).join('')}</div><p class="small muted">Du kan også skrive inn et nøyaktig antall. Ungkoller og voksne koller har en samlet ramme på 50 dyr.</p><label class="field-label" for="effort">Planlagt jaktinnsats</label><select id="effort">${[100,160,220].map(n=>`<option value="${n}" ${game.efforts[game.year-1]===n?'selected':''}>${n} jegerdager · ${n===100?'lav':n===160?'middels':'høy'} innsats</option>`).join('')}</select><p class="small muted">Mer innsats gir flere muligheter til å fylle planen. Den koster tid for jegerne, og garanterer ikke ønsket uttak.</p><div class="feedback ${sum(p)>o.estimate*.30?'hint':'neutral'}"><b>Sett uttaket i sammenheng.</b> ${sum(p)} dyr tilsvarer omtrent ${num(sum(p)/Math.max(1,o.estimate)*100)} % av midtanslaget. Samme antall kan bli en større andel hvis bestanden går ned. Felling av koller påvirker også kommende kalveproduksjon. Gjentatte høye uttak kan gi overhøsting, selv innenfor tildelingen.</div><div class="actions">${btn(`Spill jaktår ${game.year} →`,'runYear','gold')}</div><p class="small muted deck-hint">Jakta og resten av året beregnes én gang. Du kan pause, gå videre eller spille av raskt uten å endre utfallet.</p><details><summary>Rammer og fellingstillatelser</summary><p>Fjellvik har en fiktiv, godkjent femårig bestandsplan med 500 tillatelser, fordelt på 100 per år. Gruppetakene i spillet er lokale scenariorammer. Ubrukte tillatelser overføres ikke her.</p><p>En norsk bestandsplan angir årlig uttak fordelt på kjønn og alder. Spillet deler hunndyrene videre i ungkoller og voksne koller. Spissbukk betyr i regelverket bukk med ugreinet gevir; i modellen representerer gruppen ettårige hanndyr.</p><p>Endring av gjenstående plan behandles umiddelbart i dette scenariet. I praksis må nødvendige planendringer avklares med kommunen. Forenklingen skal la deg undersøke biologiske konsekvenser, ikke øve all saksbehandling.</p></details>`;}
function fiveYearPlan(){return `<section class="panel"><div class="section-head"><h3>Hele femårsplanen</h3><span class="tag">Planlagt / faktisk</span></div><div class="table-scroll"><table><thead><tr><th>År</th>${KEYS.map(k=>`<th>${GROUPS[k]}</th>`).join('')}<th>Totalt</th></tr></thead><tbody>${game.plans.map((p,i)=>`<tr class="${game.year===i+1?'current-row':''}"><th>År ${i+1}</th>${KEYS.map(k=>`<td>${p[k]}${game.history[i]?' / '+game.history[i].actual[k]:''}</td>`).join('')}<td><b>${sum(p)}${game.history[i]?' / '+sum(game.history[i].actual):''}</b></td></tr>`).join('')}</tbody></table></div>${game.phase==='plan'&&game.year<5?`<div class="actions">${btn('Bruk årets fordeling for gjenstående år','copyPlan','alt')}</div>`:''}<p class="small muted">Første tall er planen, andre tall er faktisk felt. Gjenstående år er foreløpige. Revider årets rad når du kommer til den. Startforslaget er et utgangspunkt å undersøke, ikke en anbefalt avskyting.</p></section>`;}
function board(){const m=MISSIONS[game.stage],isPlay=game.phase==='play',result=game.phase==='result';return `${campaignTop()}<div class="task-ribbon"><div><span class="kicker">Oppdraget ditt</span><p>${m.goal}</p></div><div><span class="kicker">Neste steg</span><p>${isPlay?'Følg hendelsene. Årsrapporten åpnes automatisk til slutt.':result?'Les årsrapporten, vurder valget og gå videre eller prøv året på nytt.':game.stage===3?'Fordel uttaket, begrunn planen og trykk «Spill jaktår».':'Velg kort, plasser dem i kartet og gjør vurderingen til høyre.'}</p></div><button class="text-button" data-do="showBrief">Les hele oppdraget</button></div>${notice?`<div class="notice" role="status">${esc(notice)}</div>`:''}<div class="layout"><div class="main-column"><section class="world-panel"><div class="world-head"><span class="season">${isPlay?activeFrame().season:game.stage<3?'Før første jaktår':result?'Året er gjennomført':'Før jaktår '+game.year}</span><span class="world-total">${game.obs.lo}–${game.obs.hi}<small>anslått bestand · siste undersøkelse</small></span></div>${mapView()}${isPlay?playbackControls():''}</section>${isPlay?'':game.stage===0?indicesTable()+estimatePanel():game.stage===1?telemetry():game.stage===2?stakeholders():result?yearReport(game.record):trendChart()+fiveYearPlan()+estimatePanel()}${noteBox()}</div><aside class="panel decision">${isPlay?eventPanel():result?resultPanel():game.stage<3?`<p class="kicker">Oppdrag ${game.stage+1} / 4</p><h2>${m.question}</h2><p>${m.task}</p>${cardDeck()}${game.stage===0?assessment():''}<div class="actions">${btn(`Avslutt oppdrag ${game.stage+1} →`,'commitMission','gold')}</div><p class="small muted">${game.stage===0?'Velg en vurdering før du går videre.':'Du kan gå videre uten å bruke alle poengene.'}</p>`:planPanel()}</aside></div>`;}
function missionDebrief(){const s=game.stage,m=MISSIONS[s];return `${campaignTop()}<section class="panel brief"><p class="kicker">Oppdrag ${s+1} · vurder valget</p><h1>${s===0?'Du har et beslutningsgrunnlag.':s===1?'Vintertiltakene er plassert.':'Avtalene er på plass.'}</h1><p class="lead">${s===0?'Anslaget er fortsatt usikkert. Nå skal du bruke det sammen med informasjon om leveområdene.':s===1?'Tiltakene virker når femårskampanjen starter. Passasje, vinterro og merkedata løser ulike deler av oppgaven.':'Nå skal både arealtiltakene og jaktuttaket få virke over flere år. Følg hvem som får en gevinst, og om en skade blir flyttet.'}</p><div class="goal"><b>${Object.entries(game.actions).filter(([k])=>CARDS[k].stage===s).map(([k,z])=>`${CARDS[k].name} · ${ZONES[z].name}`).join('<br>')||'Ingen tiltak valgt i dette oppdraget.'}</b></div>${s===1?(game.actions.track?`<p>GPS-utvalget omfatter ${game.tagged.filter(t=>t.summer!==t.winter).length} hjort med ulike sommer- og vinterområder. ${game.tagged.filter(t=>t.winter==='s').length} bruker Sørskogen om vinteren, og ${game.tagged.filter(t=>t.winter==='o').length} krysser kartgrensen.</p>`:'<p>Du har valgt å forvalte uten lokale GPS-data. Bruk den generelle kunnskapen om sesongtrekk, og ta høyde for usikkerheten.</p>'):''}<div class="actions">${btn(`Til oppdrag ${s+2} →`,'nextMission','gold')}${btn('Prøv et annet grep','retryMission','alt')}</div></section>${s===1&&game.actions.track?telemetry():''}`;}
function trendChart(){const rows=[{label:'Start',...observations(initialWorld(game.seed),game.actions,game.seed,0)},...game.history.map(r=>({label:'Etter '+r.year,...r.obs}))],max=Math.max(400,...rows.map(r=>r.hi))+30;const x=i=>68+i*105,y=n=>210-n/max*180;return `<section class="panel"><div class="section-head"><h3>Utviklingen du kan anslå</h3><span class="tag">Målområde 240–320</span></div><svg class="trend" viewBox="0 0 660 250" role="img" aria-label="Bestandsanslag med arbeidsintervaller; nøyaktige tall står i tabellen nedenfor"><rect x="42" y="${y(320)}" width="593" height="${y(240)-y(320)}" fill="#e0ebcf"/>${[0,100,200,300,400,500,600,700].filter(n=>n<max).map(n=>`<path d="M42 ${y(n)}H635" stroke="#d5dcca"/><text x="34" y="${y(n)+4}" text-anchor="end" fill="#516754" font-size="12">${n}</text>`).join('')}<path d="${rows.map((r,i)=>`${i?'L':'M'}${x(i)} ${y(r.estimate)}`).join(' ')}" fill="none" stroke="#345d4c" stroke-width="2"/>${rows.map((r,i)=>`<path d="M${x(i)} ${y(r.lo)}V${y(r.hi)}M${x(i)-7} ${y(r.lo)}h14M${x(i)-7} ${y(r.hi)}h14" stroke="#557d62" stroke-width="2"/><circle cx="${x(i)}" cy="${y(r.estimate)}" r="5" fill="#204d3e"/><text x="${x(i)}" y="237" text-anchor="middle" fill="#365744" font-size="12">${r.label}</text>`).join('')}</svg><details><summary>Vis tallene bak figuren</summary><table><thead><tr><th>Tidspunkt</th><th>Anslag</th><th>Arbeidsintervall</th></tr></thead><tbody>${rows.map(r=>`<tr><th>${r.label}</th><td>${r.estimate}</td><td>${r.lo}–${r.hi}</td></tr>`).join('')}</tbody></table></details><p class="small muted">Grønt felt er det fiktive lokale bestandsmålet før jakt. Streker viser usikkerhet, ikke variasjon mellom sommer- og vinterbestand. Sammenlign samme tid på året.</p></section>`;}
function metrics(r){const o=r.obs,s=r.sightings,overlap=o.hi>=240&&o.lo<=320;return [
 {name:'Bestand før neste jakt',value:`${o.estimate} · ${o.lo}–${o.hi}`,goal:'240–320 hjort',status:o.lo>=240&&o.hi<=320?'good':overlap?'uncertain':'poor',text:overlap?'Anslaget overlapper målområdet. Usikkerheten må følge beslutningen.':'Hele arbeidsintervallet ligger utenfor målområdet. Vurder uttaket på nytt.'},
 {name:'Sett kalv per kolle',value:num(s.calf,2),goal:'Minst 0,50 i dette scenariet',status:s.calf===null?'uncertain':s.calf>=.5?'good':'poor',text:'Les utviklingen over flere år. Vær, jakt og oppdagbarhet påvirker indeksen.'},
 {name:'Sett kolle per bukk',value:num(s.sex,2),goal:'1,2–2,5 i dette scenariet',status:s.sex===null?'uncertain':s.sex>=1.2&&s.sex<=2.5?'good':'poor',text:'Bruk sammensetningen til å vurdere fordelingen av uttaket.'},
 {name:'Avlingstap i prøvefelt',value:r.damage.crop+' %',goal:'Høyst 12 %',status:r.damage.crop<=12?'good':'poor',text:`Anslag fra ${r.damage.plots} par med åpne og skjermede ruter.`},
 {name:'Ungtrær med beiteskade',value:r.damage.forest+' %',goal:'Høyst 25 %',status:r.damage.forest<=25?'good':'poor',text:`${r.damage.damaged} av ${r.damage.trees} undersøkte ungtrær. Skadeutvalg, ikke hele skogen.`},
 {name:'Registrerte trafikkdødsfall',value:String(r.road),goal:'Høyst 3 per år',status:r.road<=3?'good':'poor',text:'I scenariet blir alle påkjørte dyr registrert. En passasje reduserer risikoen.'},
 {name:'Samsvar med uttaksplanen',value:`${sum(r.actual)} / ${sum(r.plan)}`,goal:'Minst 80 % av planlagt uttak',status:sum(r.plan)===0?'uncertain':sum(r.actual)>=sum(r.plan)*.8?'good':'poor',text:sum(r.plan)?'God oppfyllelse er bare nyttig hvis selve planen passer bestandsmålet.':'Ingen jakt var planlagt. Vurder bestandsutvikling og skader før neste år.'}
 ];}
function metricCards(r){const all=metrics(r),met=all.filter(m=>m.status==='good').length,uncertain=all.filter(m=>m.status==='uncertain').length;return `<div class="goal-status"><b>${met} av ${all.length} mål støttes av årets data</b><span>${uncertain?uncertain+' mål trenger mer avklaring.':'Se hvilke hensyn som trenger oppfølging.'}</span></div><div class="metric-grid">${metrics(r).map(m=>`<article class="metric ${m.status}"><span class="status-dot"></span><h3>${m.name}</h3><strong>${m.value}</strong><p>${m.goal}</p><small>${m.text}</small></article>`).join('')}</div><p class="small muted">Grønt: innenfor valgt mål. Gult: usikkert eller ikke vurderbart. Rustfarget: følg opp. Alle terskler er lokale spillmål, ikke nasjonale anbefalinger.</p>`;}
function yearAdvice(r){const last=game.history.find(h=>h.year===r.year-1);let a=[];if(r.obs.estimate<240)a.push('Bestandsanslaget ligger lavt. Prøv lavere samlet uttak; se særlig på hvor mange koller som tas ut.');else if(r.obs.estimate>320)a.push('Bestandsanslaget ligger høyt. Vurder større uttak sammen med skadeutvikling og kalveandel.');else a.push('Midtanslaget ligger i målområdet. Vurder likevel hvor mye av arbeidsintervallet som ligger utenfor.');if(r.sightings.sex>2.5)a.push('Mange observerte koller per bukk: undersøk om bukkuttaket bør reduseres.');if(r.sightings.calf!==null&&r.sightings.calf<.5)a.push('Lav observert kalveandel gir grunn til å følge rekrutteringen. Ett enkelt år fastslår ikke årsaken.');if(sum(r.actual)<sum(r.plan)*.8)a.push('Planen ble vanskelig å fylle. Se på jaktinnsats og om fordelingen etterspør dyr som det er få av.');if(last&&r.obs.estimate<last.obs.estimate*.92)a.push('Anslagene peker nedover. Et fast uttak vil da kunne ta en stadig større andel.');return a;}
function predationReport(r){if(r.predation===undefined)return '<div class="callout small">Dette året ble spilt i versjon 3.0, som ikke modellerte gaupepredasjon separat. Utfallet er bevart.</div>';return `<section class="field-report"><h3>Feltlaget: gaupespor og kadaverfunn</h3><p><b>${r.predationObserved} hjort dokumentert tatt av gaupe.</b> ${r.predationObserved?'Funnene omfatter '+KEYS.filter(k=>r.predationObservedGroups[k]).map(k=>r.predationObservedGroups[k]+' '+GROUPS[k].toLowerCase()).join(', ')+'.':'Fravær av funn viser ikke at predasjon manglet.'}</p><p>Feltlaget finner ikke alle kadavrene. ${game.actions.track?'Sendere kan gjøre det lettere å oppdage tap blant de merkede dyrene.':'Merkede dyr kunne gitt bedre oppfølging av dødsårsaker i et lite utvalg.'} Antallet funn er et minstetall, ikke et estimat for samlet tap.</p><p class="small muted">Gaupa inngår i økosystemet. Ingen poeng gis for færrest mulig gaupetap. Bruk kunnskapen sammen med rekruttering og bestandsanslag når du vurderer jaktuttaket.</p></section>`;}
function hasLegacyYears(){return !!game&&(game.history.some(r=>r.modelVersion!==VERSION)||(game.record&&game.record.modelVersion!==VERSION));}
function legacyNotice(){return hasLegacyYears()?`<div class="notice small"><b>Lagret kampanje fra en tidligere versjon.</b> Spilte år og notater bevares. Nye beregninger bruker versjon 3.2 med høyere lokalt gaupetrykk. Start en ny kampanje for å bruke samme modell gjennom alle fem år. <button class="text-button" data-do="reset">Start en ny kampanje</button></div>`:'';}
function yearReport(r){return `<section class="panel"><p class="kicker">Årsrapport · jaktår ${r.year}</p><h2>Hva forteller årets data?</h2>${metricCards(r)}${predationReport(r)}<details open><summary>Vurder neste trekk</summary><ul>${yearAdvice(r).map(t=>`<li>${t}</li>`).join('')}</ul></details><div class="stakeholder"><b>Tilbakemelding fra grunneierne</b><p>${r.damage.crop<=12?'Gårdbrukeren melder at avlingstapet er innenfor det avtalte målet.':'Gårdbrukeren mener avlingstapet fortsatt er for høyt.'} ${r.damage.forest<=25?'Skogeieren ser tilfredsstillende foryngelse i prøvefeltene.':'Skogeieren ber om mer oppfølging av beiteskadene.'}</p></div><p class="small muted">Predasjon, andre naturlige tap og fødsler er ikke fullstendig registrert. Derfor får du ingen fasit på bestandsregnskapet mens du planlegger. Modellens regnskap kan åpnes etter fem år.</p></section>${trendChart()}${fiveYearPlan()}${indicesTable()}${game.actions.track?telemetry():''}`;}
function resultPanel(){const r=game.record;return `<p class="kicker">År ${game.year} er gjennomført</p><h2>${r.obs.hi<240?'Et tydelig varsel':r.obs.lo>320?'Beitepresset må følges':'Bruk det du nå vet'}</h2><p>Det ble felt <b>${sum(r.actual)} av ${sum(r.plan)} planlagte dyr</b>. Neste års bestandsanslag er <b>${r.obs.lo}–${r.obs.hi}</b>.</p><p>Les målene under kartet. Noter hva du vil beholde og hva du vil endre.</p>${game.comparison?`<div class="feedback neutral"><b>Forrige forsøk med samme år:</b> ${game.comparison.obs.lo}–${game.comparison.obs.hi} i bestandsintervall, ${sum(game.comparison.actual)} felt og ${game.comparison.road} trafikkdødsfall. Nå kan du sammenligne konsekvensene av planene.</div>`:''}<div class="actions vertical">${btn(game.year<5?'Planlegg neste jaktår →':'Avslutt oppdrag 4 · se sluttrapporten →','nextYear','gold')}${btn('Prøv året med annet uttak','retryYear','alt')}${btn('Spill hendelsene om igjen','replayYear','alt')}</div><p class="small muted">Et nytt forsøk starter med samme bestand, vær og tilfeldige grunnlag. Å spille animasjonen om igjen endrer aldri resultatet.</p>`;}
function finalView(){const last=game.history.at(-1);return `<section class="report-intro"><p class="kicker">Fem år i Fjellvik · sluttrapport</p><h1>Hva slags bestand<br>forvalter du videre?</h1><p class="lead">Du har felt ${game.history.reduce((s,r)=>s+sum(r.actual),0)} hjort gjennom fem jaktår. Det siste bestandsanslaget er ${last.obs.lo}–${last.obs.hi}. Utfallet må vurderes mot flere mål samtidig.</p></section>${metricCards(last)}<section class="panel">${predationReport(last)}</section>${trendChart()}<section class="panel"><h2>Resultatet gjennom hele perioden</h2><div class="table-scroll"><table><thead><tr><th>År</th><th>Anslag etter året</th><th>Felt / plan</th><th>Avlingstap</th><th>Skadde trær</th><th>Trafikkdødsfall</th></tr></thead><tbody>${game.history.map(r=>`<tr><th>${r.year}</th><td>${r.obs.estimate} (${r.obs.lo}–${r.obs.hi})</td><td>${sum(r.actual)} / ${sum(r.plan)}</td><td>${r.damage.crop} %</td><td>${r.damage.forest} %</td><td>${r.road}</td></tr>`).join('')}</tbody></table></div><p>Lavere skader med en bestand under målområdet er heller ikke full måloppnåelse. En velfylt uttaksplan kan ha vært for stor. Bruk både utfallet og begrunnelsene dine når du vurderer forvaltningen.</p><label for="reflection">Din konklusjon: Hva ville du videreført, og hva ville du endret?</label><textarea id="reflection" rows="5" placeholder="Vis til minst to indikatorer og en usikkerhet …">${esc(game.notes.final||'')}</textarea><details><summary>Svarstøtte til avslutningen</summary><p>${yearAdvice(last).join(' ')}</p><p>Vurder også kostnadsfordelingen mellom skog og jordbruk, og om merkedata endret din forståelse av trekk. Et godt svar begrunner valgene og erkjenner usikkerhet; det trenger ikke lande på samme løsning som et annet lag.</p></details></section>${fiveYearPlan()}${notesReport()}${modelTruth()}<div class="actions">${btn('Last ned rapport og notater','download','gold')}${btn('Spill samme landskap på nytt','reset','alt')}${btn('Faggrunnlag og modell','help','alt')}</div>`;}
function notesReport(){return `<section class="panel"><h2>Notatene dine</h2>${Object.entries(game.notes).filter(([,v])=>v.trim()).map(([k,v])=>`<article class="note-entry"><h3>${k==='final'?'Konklusjon':k.startsWith('year')?'Jaktår '+k.slice(4):'Oppdrag '+(Number(k.slice(7))+1)}</h3><p class="preserve">${esc(v)}</p></article>`).join('')||'<p>Du har ikke skrevet noen notater ennå. Bruk forvaltningsloggen under kartet.</p>'}</section>`;}
function modelTruth(){return `<section class="panel"><details id="modelTruth"><summary>Etterarbeid: åpne modellens skjulte regnskap</summary><p><b>Dette er spillets fasit, ikke feltdata.</b> Nå som beslutningene er tatt, kan du undersøke avstanden mellom modellens bestand og anslagene. Forvalteren hadde ikke tilgang til disse tallene underveis.</p><div class="table-scroll"><table><thead><tr><th>År</th><th>Start</th><th>Født</th><th>Øvrig naturlig død</th><th>Gaupe</th><th>Trafikk</th><th>Felt</th><th>Inn</th><th>Ut</th><th>Slutt</th></tr></thead><tbody>${game.history.map(r=>`<tr><th>${r.year}</th><td>${r.start}</td><td>${r.births}</td><td>${r.natural}</td><td>${predationText(r)}</td><td>${r.road}</td><td>${sum(r.actual)}</td><td>${r.immigration}</td><td>${r.emigration}</td><td>${r.end}</td></tr>`).join('')}</tbody></table></div><p><b>Slutt = start + fødte − øvrige naturlige dødsfall − gaupetap − trafikkdødsfall − felte + innvandring − utvandring.</b> Inn og ut inkluderer sesongbesøk. Samme dyr kan forlate kartet og vende tilbake. Død utenfor kartet inngår ikke som lokalt dødsfall. Gaupetap holdes atskilt fra øvrig naturlig død og trekkes fra én gang. En strek betyr at gaupe ikke var modellert separat i et eldre spillår.</p>${game.history.map(r=>`<details><summary>År ${r.year}: områder og dyregrupper</summary><table><thead><tr><th>Område</th><th>Start</th><th>Født</th><th>Død*</th><th>Felt</th><th>Inn</th><th>Ut</th><th>Slutt</th></tr></thead><tbody>${Object.entries(r.ledger).map(([z,l])=>`<tr><th>${ZONES[z].name}</th><td>${l.start}</td><td>${l.births}</td><td>${l.natural+l.road+(l.predation||0)}</td><td>${l.hunt}</td><td>${l.enter}</td><td>${l.leave}</td><td>${l.end}</td></tr>`).join('')}</tbody></table><p class="small">* Naturlig død, inkludert gaupepredasjon, og trafikk. Flytting mellom delområder endrer ikke samlet bestand.</p><table><thead><tr><th>Dyregruppe</th><th>Før året</th><th>Gaupetap</th><th>Etter året</th></tr></thead><tbody>${KEYS.map(k=>`<tr><th>${GROUPS[k]}</th><td>${r.startGroups[k]}</td><td>${r.predationGroups?.[k]??'–'}</td><td>${r.endGroups[k]}</td></tr>`).join('')}</tbody></table></details>`).join('')}<p>Et intervall trenger ikke treffe fasiten hvert år. Flere observasjoner hjelper bare hvis metoden og forutsetningene også er rimelige. Sammenlign anslagene med fasiten og diskuter hva som ville vært vanskelig å vite i virkeligheten.</p></details></section>`;}
function journal(){return `<div class="section-head"><div><p class="kicker">Fjellvik · din kampanje</p><h1>Rapport og notater</h1></div>${btn('Tilbake til spillet','back','alt')}</div>${game.history.length?trendChart()+fiveYearPlan():`<div class="callout">Årsrapportene kommer når du begynner femårskampanjen. Notatene og tiltakene lagres allerede.</div>`}<section class="panel"><h3>Valgte tiltak</h3><ul>${Object.entries(game.actions).map(([k,z])=>`<li>${CARDS[k].name} · ${ZONES[z].name} · ${CARDS[k].cost} poeng</li>`).join('')||'<li>Ingen tiltak plassert.</li>'}</ul></section>${notesReport()}${game.phase==='end'?modelTruth():''}<div class="actions">${btn('Last ned rapport og notater','download','gold')}${btn('Tilbake til spillet','back','alt')}${btn('Begynn på nytt','reset','alt')}</div>`;}
function render(focus=false){const active=document.activeElement?.id;$('#journalButton').disabled=!game;$('#app').innerHTML=legacyNotice()+(resetPrompt?`<section class="reset panel"><h2>Starte samme landskap på nytt?</h2><p>Nåværende kampanje blir erstattet. Last ned rapporten først hvis du vil beholde notatene.</p><div class="actions">${btn('Last ned rapporten','download','alt')}${btn('Start på nytt','confirmReset')}${btn('Avbryt','cancelReset','alt')}</div></section>`:'')+(screen==='help'?helpView():screen==='journal'&&game?journal():!game?intro():game.phase==='end'?finalView():game.phase==='brief'?briefing():game.phase==='debrief'?missionDebrief():board());bind();save();if(game?.phase==='play'&&!screen)paintScene();if(focus){$('#app').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}else if(active&&document.getElementById(active))document.getElementById(active).focus({preventScroll:true});}
function setPlan(k,value){const p=copy(game.plans[game.year-1]);p[k]=value;const error=planError(p);if(error){notice=error;announce(error);}else{game.plans[game.year-1]=p;notice='';}render();}
function placeCard(z){zone=z;if(!selected){notice=ZONES[z].name+': '+ZONES[z].habitat+'.';render();return;}const c=CARDS[selected];if(!c.targets.includes(z)){notice='Velg et av de markerte stedene for dette kortet.';render();return;}if(!game.actions[selected]&&cost(game.actions,game.stage)+c.cost>BUDGETS[game.stage]){notice='Du har ikke nok poeng. Fjern et kort for å omprioritere.';render();return;}game.actions[selected]=z;notice=c.name+' er plassert. '+c.effect;announce(notice);selected='';if(game.stage===0)game.obs=observations(game.world,game.actions,game.seed,0);render();}
function runYear(){if(game.stage!==3||game.phase!=='plan')return;const p=game.plans[game.year-1];const error=planError(p);if(error){notice=error;render();return;}game.checkpoint={world:copy(game.world),obs:copy(game.obs)};const result=simulateYear(game.world,game.actions,p,game.efforts[game.year-1],game.seed,game.year,game.actions.track?game.tagged.map(t=>t.id):[]);game.record=result.record;game.pendingWorld=result.world;game.phase='play';game.frame=0;game.elapsed=0;notice='';pauseReason='';render(true);play();}
function finishYear(){pause();if(game.phase!=='play')return;game.world=copy(game.pendingWorld);game.pendingWorld=null;game.obs=copy(game.record.obs);game.history[game.year-1]=copy(game.record);game.phase='result';game.frame=game.record.frames.length-1;game.elapsed=0;render(true);announce('Året er ferdig. Årsrapporten er klar.');}
function retryYear(){pause();game.comparison=copy(game.record);game.world=copy(game.checkpoint.world);game.obs=copy(game.checkpoint.obs);game.history=game.history.slice(0,game.year-1);game.record=null;game.pendingWorld=null;game.phase='plan';game.frame=0;game.elapsed=0;notice='Samme utgangspunkt og samme vær. Endre uttaket eller jaktinnsatsen og sammenlign.';render(true);}
function downloadReport(){const chunks=['FJELLVIK – LANDSKAPET SVARER','Hjorteutgaven 3.1 · fiktivt scenario','Laget av Ronny Steen, inspirasjon fra Leif Egil Loe. Vibbekoding ChatGPT (GPT-6 Astra Max).','Alle lokale tall og mål er konstruert. Bestandsanslagene er usikre arbeidsintervaller.','\nTILTAK',...Object.entries(game.actions).map(([k,z])=>CARDS[k].name+' · '+ZONES[z].name),'\nÅRSRAPPORTER'];for(const r of game.history){chunks.push('\nJaktår '+r.year,`Bestandsanslag før neste jakt: ${r.obs.estimate}, arbeidsintervall ${r.obs.lo}–${r.obs.hi}.`,...KEYS.map(k=>`${GROUPS[k]}: plan ${r.plan[k]}, felt ${r.actual[k]}.`),...metrics(r).map(m=>`${m.name}: ${m.value}. Mål: ${m.goal}.`),`Innsats: ${r.effort} jegerdager.`,r.predation===undefined?'Gaupe ikke modellert separat i dette eldre spillåret.':`Dokumenterte gaupetap: ${r.predationObserved}. Uoppdagede tap kan forekomme.`,...yearAdvice(r));if(game.actions.track)chunks.push('GPS-utvalgets ruter:',...r.tracks.map(t=>t.tag+': '+t.path.map(p=>p.season+' '+(ZONES[p.zone]?.name||'ingen posisjon')).join(' → ')));}chunks.push('\nNOTATER',...Object.entries(game.notes).map(([k,v])=>k+'\n'+v));if(game.phase==='end')chunks.push('\nETTERARBEID: MODELLENS FASIT – IKKE FELTDATA',...game.history.map(r=>`År ${r.year}: start ${r.start} + født ${r.births} - øvrig naturlig død ${r.natural} - gaupetap ${predationCount(r)} - trafikk ${r.road} - jakt ${sum(r.actual)} + inn ${r.immigration} - ut ${r.emigration} = slutt ${r.end}.`));const blob=new Blob([chunks.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Fjellvik-hjort-rapport.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function action(id){switch(id){case 'start':game=fresh();screen='';render(true);break;case 'briefDone':game.phase=game.returnPhase||'plan';delete game.returnPhase;render(true);break;case 'showBrief':pause();game.returnPhase=game.phase;game.phase='brief';render(true);break;case 'commitMission':if(game.phase!=='plan'||game.stage>=3)return;if(game.stage===0&&!game.answers.trend){notice='Velg en vurdering av jaktloggene før du går videre.';render();return;}selected='';notice='';game.phase='debrief';render(true);break;case 'nextMission':if(game.phase!=='debrief'||game.stage>=3)return;game.stage++;game.phase='brief';notice='';render(true);break;case 'retryMission':game.phase='plan';notice='Omprioriter kortene. Bruk Fjern for å frigjøre poeng.';render(true);break;case 'copyPlan':for(let y=game.year;y<5;y++)game.plans[y]=copy(game.plans[game.year-1]);notice='Årets fordeling er lagt inn i de gjenstående årene. Du kan revidere hvert år.';render();break;case 'runYear':runYear();break;case 'nextYear':if(game.phase!=='result')return;if(game.year===5)game.phase='end';else{game.year++;game.phase='plan';game.record=null;game.comparison=null;game.checkpoint=null;}notice='';render(true);break;case 'retryYear':retryYear();break;case 'replayYear':game.pendingWorld=copy(game.world);game.phase='play';game.frame=0;game.elapsed=0;render(true);play();break;case 'play':playing?pause('Du har satt avspillingen på pause.'):play();render();break;case 'step':pause();nextFrame();break;case 'skip':finishYear();break;case 'replayEvent':pause();game.elapsed=0;render();play();break;case 'help':pause('Avspillingen er satt på pause mens du leser.');screen='help';render(true);break;case 'journal':pause('Avspillingen er satt på pause mens du leser rapporten.');screen='journal';render(true);break;case 'back':screen='';render(true);break;case 'download':downloadReport();break;case 'reset':pause();resetPrompt=true;render(true);break;case 'cancelReset':resetPrompt=false;render();break;case 'confirmReset':game=fresh(game.seed);resetPrompt=false;screen='';selected='';notice='';render(true);break;}}
function bind(){document.querySelectorAll('[data-do]').forEach(b=>b.onclick=()=>action(b.dataset.do));document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{selected=selected===b.dataset.card?'':b.dataset.card;notice='';render();if(selected&&window.innerWidth<=830)document.querySelector('.world-panel')?.scrollIntoView({behavior:reduced()?'instant':'smooth',block:'start'});});document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>placeCard(b.dataset.zone));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete game.actions[b.dataset.remove];selected='';notice='Kortet er fjernet.';if(game.stage===0)game.obs=observations(game.world,game.actions,game.seed,0);render();});document.querySelectorAll('input[name="trend"]').forEach(e=>e.onchange=()=>{game.answers.trend=e.value;render();});if($('#note'))$('#note').oninput=e=>{game.notes[noteKey()]=e.target.value;save();};if($('#reflection'))$('#reflection').oninput=e=>{game.notes.final=e.target.value;save();};document.querySelectorAll('[data-adjust]').forEach(b=>b.onclick=()=>setPlan(b.dataset.adjust,Math.max(0,game.plans[game.year-1][b.dataset.adjust]+Number(b.dataset.delta))));for(const k of KEYS)if($('#quota-'+k))$('#quota-'+k).onchange=e=>setPlan(k,Number(e.target.value));if($('#effort'))$('#effort').onchange=e=>{game.efforts[game.year-1]=Number(e.target.value);save();};document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{pause();game.frame=Number(b.dataset.frame);game.elapsed=0;pauseReason='Valgt hendelse. Trykk Fortsett for automatisk avspilling.';render();});if($('#motion'))$('#motion').onchange=e=>{game.reduced=e.target.checked;save();paintScene();};}

// Summaries use only the GPS positions shown to the player, never the hidden census.
function telemetryData(last=game.history.at(-1),tagged=game.tagged){
 const annual=!!last;
 const rows=annual?(last.tracks||[]).map(t=>({tag:t.tag,start:t.path[0]?.zone||null,autumn:t.path.find(p=>p.season==='Senhøst')?.zone||null,winter:t.path.find(p=>p.season==='Vinter')?.zone||null,end:t.path.at(-1)?.zone||null,outside:t.path.some(p=>p.zone==='o')})):tagged.map(t=>({tag:t.tag,start:t.summer,autumn:t.winter,winter:t.winter,end:null,outside:t.summer==='o'||t.winter==='o'}));
 const counts=()=>({n:0,e:0,s:0,o:0,unknown:0}),summer=counts(),winter=counts();
 for(const r of rows){summer[r.start||'unknown']++;winter[r.winter||'unknown']++;}
 const routes=rows.filter(r=>r.start&&r.autumn),internal=routes.filter(r=>r.start!=='o'&&r.autumn!=='o');
 return {annual,year:last?.year,n:rows.length,rows,summer,winter,knownRoutes:routes.length,missingRoutes:rows.length-routes.length,moving:routes.filter(r=>r.start!==r.autumn).length,internalRoutes:internal.length,road:internal.filter(r=>(r.start==='s')!==(r.autumn==='s')).length,outside:rows.filter(r=>r.outside).length};
}
function telemetryChart(s){
 if(!s.n)return '<p class="callout small">Ingen merkede dyr har kjent startposisjon dette året. Et tomt GPS-utvalg betyr ikke at området er tomt for hjort.</p>';
 const zones=['n','e','s','o',...(s.summer.unknown||s.winter.unknown?['unknown']:[])],width=330,x0=165,height=95+zones.length*58,max=s.n;
 const ticks=[...new Set([0,Math.ceil(max/2),max])];
 const description=zones.map(z=>`${z==='unknown'?'Ukjent posisjon':ZONES[z].name}: ${s.summer[z]} før, ${s.winter[z]} om vinteren`).join('. ');
 return `<figure class="gps-chart"><figcaption><b>Fra ${s.annual?'før jakt':'sommer'} til vinter</b><span>Antall merkede hjort · samme utvalg ved begge tidspunkt</span></figcaption><svg viewBox="0 0 605 ${height}" role="img" aria-label="GPS-posisjoner i sommer- og vinterområder"><title>Områdene brukt av ${s.n} merkede hjort</title><desc>${description}. Manglende posisjoner vises som ukjent.</desc><g font-family="system-ui,sans-serif" font-size="16"><rect x="165" y="12" width="13" height="10" rx="2" fill="#bb8541"/><text x="185" y="22" fill="#4e5d47">${s.annual?'Før jakt':'Sommer'}</text><rect x="315" y="12" width="13" height="10" rx="2" fill="#2b6858"/><text x="335" y="22" fill="#4e5d47">Vinter</text>${ticks.map(t=>`<path d="M${x0+t/max*width} 47V${height-34}" stroke="#dce0cf"/><text x="${x0+t/max*width}" y="${height-12}" text-anchor="middle" fill="#64715a">${t}</text>`).join('')}${zones.map((z,i)=>{const y=54+i*58;return `<text x="5" y="${y+19}" fill="#294a3b" font-weight="600">${z==='unknown'?'Ukjent posisjon':ZONES[z].name}</text><rect x="${x0}" y="${y}" width="${s.summer[z]/max*width}" height="11" rx="3" fill="#bb8541"/><text x="${x0+s.summer[z]/max*width+8}" y="${y+10}" fill="#735023">${s.summer[z]}</text><rect x="${x0}" y="${y+16}" width="${s.winter[z]/max*width}" height="11" rx="3" fill="#2b6858"/><text x="${x0+s.winter[z]/max*width+8}" y="${y+26}" fill="#244e42">${s.winter[z]}</text>`;}).join('')}</g></svg></figure>`;
}
function telemetryGuidance(s){
 if(!s.n)return '<p>Bruk tidligere merkedata, registrerte påkjørsler og kunnskap om leveområdene. Nye merkedata trengs for å følge endringer i arealbruken.</p>';
 const road=s.road?`<b>Trygg veikryssing:</b> ${s.road} av ${s.internalRoutes} sammenlignbare ruter innenfor kartet går mellom Sørskogen og områdene nord for veien. Dette gir støtte til en sikret passasje ved kryssingen.`:'<b>Trygg veikryssing:</b> Ingen av de sammenlignbare rutene viser kryssing av veien. Det lille utvalget kan ha oversett slike ruter; bruk også registrerte påkjørsler.';
 const south=s.winter.s,north=s.winter.n;
 const quiet=south+north===0?'<b>Vinterro:</b> Ingen merket hjort har en kjent vinterposisjon i Nordlia eller Sørskogen. Dette utvalget gir lite grunnlag for å velge mellom de to områdene.':`<b>Vinterro:</b> ${south} merkede hjort bruker Sørskogen om vinteren og ${north} bruker Nordlia. ${south===north?'Utvalget alene skiller ikke mellom de to områdene.':`Hvis du prioriterer vinterro, taler disse posisjonene for ${south>north?'Sørskogen':'Nordlia'}.`}`;
 const outside=s.outside?`<b>Samarbeid:</b> ${s.outside} merkede hjort er registrert i naboområdet. En lokal økning i observasjoner kan derfor skyldes trekk. Samordne vurderingen med naboene.`:'<b>Kartgrensen:</b> Ingen av disse senderne er registrert i naboområdet. Det utelukker ikke at andre hjort trekker over grensen.';
 return `<ul><li>${road}</li><li>${quiet}</li><li>${outside}</li></ul>`;
}
function telemetry(){
 if(!game.actions.track)return `<section class="panel"><h3>Trekkloggen er ikke åpnet</h3><p>Uten merkekortet har du generell kunnskap om områdene, men ingen GPS-ruter fra Fjellvik. Du kan fortsatt forvalte, men må ta høyde for denne usikkerheten.</p></section>`;
 const s=telemetryData(),name=z=>ZONES[z]?.name||'–';
 return `<section class="panel telemetry-panel"><div class="section-head"><h3>Følg merkede dyr</h3><span class="tag">${s.annual?'Jaktår '+s.year:'Forrige sesong'} · GPS-utvalg</span></div><p>${s.annual?`Årets logg omfatter ${s.n} merkede hjort med kjent posisjon før jakt.`:`Du har åpnet data fra ${s.n} merkede hjort i forrige sesong.`} Oppsummeringen viser hvor disse dyrene er registrert, og hvilke tiltak rutene kan gi støtte til.</p>${telemetryChart(s)}<div class="gps-metrics"><div><strong>${s.moving} <small>av ${s.knownRoutes}</small></strong><b>Sesongtrekk</b><span>Ulike områder ved to kjente posisjoner.</span></div><div><strong>${s.road} <small>av ${s.internalRoutes}</small></strong><b>Rute over veien</b><span>Ruter med begge ender innenfor kartet.</span></div><div><strong>${s.outside} <small>av ${s.n}</small></strong><b>Bruker naboområdet</b><span>Minst én registrert posisjon utenfor kartet.</span></div></div><p class="small muted gps-basis">${s.annual?'Ruter sammenligner posisjon før jakt og på senhøsten. Vintergrafen viser posisjonen senere på vinteren.':'Ruter sammenligner sommer- og vinterområdet.'} ${s.missingRoutes?`${s.missingRoutes} dyr mangler en av rutens endeposisjoner og inngår ikke i rutestatistikken.`:'Alle dyrene har to kjente endeposisjoner for rutestatistikken.'} Manglende posisjoner regnes som ukjent arealbruk, ikke som stasjonære dyr. En registrert rute er ikke et antall daglige veikryssinger.</p><details class="gps-guidance" open><summary>Hva taler dataene for?</summary>${telemetryGuidance(s)}<p class="small muted">Vurder funnene sammen med tiltakskostnader, forstyrrelser og skadebildet. Utvalget gir støtte til en prioritering, ikke én fasit.</p></details><details class="gps-individuals"><summary>Se posisjonene for hvert individ (${s.n} dyr)</summary><div class="table-scroll"><table><caption>Posisjonene bak oppsummeringen</caption><thead><tr><th>Merke</th><th>${s.annual?'Før jakt':'Sommer'}</th>${s.annual?'<th>Senhøst</th>':''}<th>Vinter</th><th>${s.annual?'Neste sommer':'Rute'}</th></tr></thead><tbody>${s.rows.map(r=>`<tr><th>${r.tag}</th><td>${name(r.start)}</td>${s.annual?`<td>${name(r.autumn)}</td>`:''}<td>${name(r.winter)}</td><td>${s.annual?name(r.end):r.start===r.winter?'Stasjonær':'Sesongtrekk'}</td></tr>`).join('')}</tbody></table></div></details><p class="small muted">Utvalget er lite og kan være skjevt. Fordelingen blant de merkede hjortene er ikke nødvendigvis fordelingen i hele bestanden. GPS gjør ikke usikre bestandstall eksakte.</p></section>`;
}

function deer(x,y,scale=1,kind='af',cls=''){const s=scale*(kind==='c'?.59:kind==='yf'||kind==='ym'?.84:kind==='am'?1.10:1),stag=kind==='am',spike=kind==='ym';return `<g class="deer-shape ${cls}" transform="translate(${x} ${y}) scale(${s})"><path d="M-22-8Q-13-17 8-11L14-30Q16-36 22-35L34-27l-1 5-17 1L13-4l-1 26H8L5 1-7 1-12 22h-4l3-29-11 3Z" fill="${kind==='c'?'#b88450':stag?'#755037':'#9a6945'}" stroke="#503d2c" stroke-width="1.2"/><path d="m-22-8-1 12 7-2 1-12Z" fill="#e7cda5"/><path d="m17-34-6-11 8 5m5 5 6-11 2 10" fill="#986949" stroke="#503d2c" stroke-width="1"/><circle cx="28" cy="-29" r="1.4" fill="#201e17"/><path d="m32-24 3-1" stroke="#32261d" stroke-width="2" stroke-linecap="round"/>${stag?'<path d="M18-35 12-46 9-64m4 18-9-6m6-6-7-4m7 6 5-8m8 28 4-13 6-19m-6 19 9-5m-5-9 7-6m-9 15-4-7" fill="none" stroke="#594333" stroke-width="2.5" stroke-linecap="round"/>':spike?'<path d="m18-36-5-16m11 16 3-18" fill="none" stroke="#594333" stroke-width="2.2" stroke-linecap="round"/>':''}${kind==='c'?'<g class="calf-spots" fill="#f8e0b6"><circle cx="-9" cy="-9" r="1.7"/><circle cx="-1" cy="-8" r="1.7"/><circle cx="-6" cy="-4" r="1.5"/></g>':''}</g>`;}
function mapAnimals(){const spots={n:[[108,164,'af'],[163,220,'c'],[277,239,'af'],[350,190,'am'],[337,273,'yf'],[203,172,'ym']],e:[[590,214,'af'],[600,283,'c'],[743,250,'af'],[795,304,'am'],[678,333,'yf'],[773,190,'c']],s:[[216,438,'af'],[318,529,'c'],[463,539,'af'],[535,486,'am'],[476,434,'yf'],[601,556,'ym'],[181,528,'af']]};return Object.values(spots).flat().map(([x,y,k])=>deer(x,y,.71,k)).join('');}

function mapView(){const frame=activeFrame(),targets=selected?CARDS[selected].targets:[],winter=frame?.type==='winter'||frame?.type==='predation';return `<div class="map ${winter?'winter':''}">${terrainBase()}${mapMarks()}<g id="residentAnimals">${mapAnimals()}</g><g id="sceneLayer"></g><text x="591" y="87" font-family="Georgia,serif" font-size="20" fill="#577769" font-style="italic" transform="rotate(-8 591 87)">Fjellvatnet</text><text x="782" y="474" font-family="system-ui,sans-serif" font-size="12" fill="#4c6c48">Gården</text><text x="764" y="585" font-family="system-ui,sans-serif" font-size="12" fill="#4c6c48">↔ Naboområdet</text></svg>${['n','e','s'].map(z=>`<button class="pin ${z} ${targets.includes(z)?'target':''}" data-zone="${z}" ${game.phase!=='plan'||game.stage===3?'disabled':''}><strong>${ZONES[z].name}</strong><small>${z==='p'?(game.actions.passage?'Sikret undergang':'Kryssing av veien'):ZONES[z].habitat}</small>${targets.includes(z)?'<em>Plasser kort her</em>':''}</button>`).join('')}${passageTarget()}${frame?`<div class="event-overlay">${frame.title}</div>`:''}<div class="compass">N<b>↑</b></div></div><div class="map-caption"><span>Symbolene illustrerer hjort og prosesser. De viser ikke antall dyr.</span><span>Fiktivt kart · ikke i målestokk</span></div>${game.actions.passage?'<div class="map-measure"><span aria-hidden="true">✓</span> Faunapassasje sikret · undergang med ledegjerder</div>':''}<div class="animal-key">${[['c','Kalv'],['yf','Ungkolle'],['ym','Spissbukk'],['af','Kolle'],['am','Bukk']].map(([k,t])=>`<span><svg viewBox="-27 -70 68 100" aria-hidden="true">${deer(0,0,1,k)}</svg>${t}</span>`).join('')}</div>`;}
const activeFrame=()=>game?.phase==='play'?game.record.frames[game.frame]:null;
function huntUnits(f){const units=[];let current=null,total=0;for(const d of f.huntList){if(!current||current.k!==d.k||current.n>=5||total===10||total===30||total===60){current={k:d.k,z:d.z,n:0};units.push(current);}current.n++;total++;}return units;}
function duration(f=activeFrame()){if(!f)return 0;return f.type==='hunt'?Math.max(2000,huntUnits(f).length*1900):({predation:5700,move:4900,winter:3800,natural:3500,birth:3300,age:3100,browse:2800,rut:2600,survey:2500}[f.type]||2800);}
function autoRate(t=game.elapsed,f=activeFrame()){if(f?.type!=='hunt')return 1;const done=huntUnits(f).slice(0,Math.floor(t/1900)).reduce((s,u)=>s+u.n,0);return done<10?1:done<30?2:done<60?4:8;}
function playbackControls(){const f=activeFrame();return `<div class="playback"><div class="playback-top"><span id="playStatus" role="status">${playing?'Spiller':pauseReason||'Klar til avspilling'}</span><b>Hendelse ${game.frame+1} / ${game.record.frames.length}</b></div><progress id="eventProgress" max="${duration()}" value="${game.elapsed}" aria-label="Fremdrift i hendelsen"></progress><div class="actions">${btn(playing?'Pause':'Fortsett','play')}${btn('Neste hendelse →','step','alt')}${btn('Vis årsrapporten','skip','alt')}</div><div class="event-dots" aria-label="Velg hendelse">${game.record.frames.map((f,i)=>`<button data-frame="${i}" class="${i===game.frame?'current':''}" aria-label="Hendelse ${i+1}: ${f.title}" title="${f.title}" ${i===game.frame?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><label class="motion"><input id="motion" type="checkbox" ${reduced()?'checked':''}> Rolige illustrasjoner uten bevegelser</label></div>`;}
function eventPanel(){const f=activeFrame();return `<p class="kicker">Hendelse ${game.frame+1} / ${game.record.frames.length}</p><h2>${f.title}</h2><p>${f.body}</p><div class="event-status" id="eventDetail"></div><div class="callout small">${f.type==='hunt'?'Felte dyr registreres. Hver animert felling sammenfatter inntil fem felte dyr. De første ti vises i normalt tempo; resten går gradvis raskere.':f.type==='predation'?'Gaupa smyger seg innpå og angriper. Ett symbol illustrerer hendelsen og viser ikke hele tapet. Funn av kadavre gir et minstetall, ikke en full telling.':f.type==='move'?'Trekk skjer både mellom områdene og over kartgrensen. Animasjonen illustrerer prosessen. Merkekortet gir konkrete ruter fra GPS-utvalget.':f.type==='age'?'Her flyttes dyr mellom aldersgrupper. Ingen dyr forsvinner fordi de blir ett år eldre.':f.type==='winter'||f.type==='natural'?'Et dyr som synker sammen og toner bort, illustrerer naturlig død. Illustrasjonen røper ikke alle skjulte tap. Alder øker risikoen hos gamle dyr, men er ingen fast utløpsdato.':'Dette er en prosessillustrasjon, ikke en fullstendig feltobservasjon.'}</div><div class="actions">${btn('Spill hendelsen på nytt','replayEvent','alt')}</div><p class="small muted">Bytter du fane, blir avspillingen satt på pause. Fortsett starter fra samme sted.</p>`;}
function reduced(){return game?.reduced??(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches||false);}
function paintScene(){const f=activeFrame(),layer=$('#sceneLayer');if(!f||!layer||screen)return;const time=game.elapsed,total=duration(f),progress=clamp(time/total,0,1),q=reduced()?1:progress;let html='',detail='';
 if(f.type==='hunt'){const units=huntUnits(f),i=Math.min(Math.floor(time/1900),Math.max(0,units.length-1)),u=units[i],local=time-i*1900,hit=local>=820,fall=reduced()?(hit?1:0):clamp((local-820)/550,0,1),done=units.slice(0,i).reduce((s,x)=>s+x.n,0)+(hit?(u?.n||0):0);if(u){const p={n:{x:306,y:251},e:{x:685,y:281},s:{x:418,y:520}}[u.z];html=`<g transform="translate(${p.x} ${p.y})"><ellipse cx="-20" cy="8" rx="110" ry="54" fill="#fff7de" opacity=".78"/><g transform="translate(-91 10) scale(1.15)">${hunterIcon()}</g>${!reduced()&&autoRate()<=2&&hit&&local<910?'<path d="m-43-6 10-4-3-7 13 7 9-1-8 6 5 7-12-4-7 5 2-8z" fill="#ffd586"/>':''}<g transform="translate(${fall*4} ${fall*14}) rotate(${fall*79} 0 14)" opacity="${1-fall*.35}">${deer(10,0,1.2,u.k)}</g><text x="0" y="-83" text-anchor="middle" fill="#24483b" font-size="18" font-weight="700">${hit?'−'+u.n:'Jaktuttak'}</text></g>`;}detail=units.length?`${done} av ${sum(f.actual)} dyr felt · tempo ${autoRate()}×`:'Ingen dyr ble felt dette året.';}
 else if(f.type==='move'){const source=game.actions.track?f.routes.filter(r=>game.tagged.some(t=>t.id===r.id)):f.routes;const routes=source.length?[source[0],source[Math.floor(source.length*.5)],source.at(-1)]:[];for(let i=0;i<routes.length;i++){const r=routes[i],a=ZONES[r.from],b=ZONES[r.to],v=reduced()?1:clamp((q-.08*i)/.70,0,1),x=(1-v)**2*a.x+2*(1-v)*v*520+v*v*b.x,y=(1-v)**2*a.y+2*(1-v)*v*350+v*v*b.y;html+=`<path d="M${a.x} ${a.y} Q520 350 ${b.x} ${b.y}" fill="none" stroke="#ad742f" stroke-width="3" stroke-dasharray="8 6"/><g transform="translate(${x} ${y})"><circle r="28" fill="#fff8dd" opacity=".8"/>${deer(0,0,.83,i===1?'c':'af')}</g>`;}const tx=-100+q*1170,ty=300+Math.pow(clamp(tx/930,0,1),1.4)*135;html+=`<g transform="translate(${reduced()?605:tx} ${reduced()?386:ty}) scale(.83)">${truckIcon()}</g>`;if(f.traffic>0){const crashX=f.hasPassage?620:500,crashY=300+Math.pow(crashX/930,1.4)*135+6,impact=(crashX+100)/1170,fall=clamp((q-impact)/.14,0,1);html+=`<g class="traffic-collision" transform="translate(${crashX} ${crashY})"><g transform="rotate(${fall*83})" opacity="${1-fall*.45}">${deer(0,0,.83,'af')}</g></g>`;}detail=f.traffic?`${f.traffic} trafikkdødsfall registrert i denne trekkperioden.`:'Ingen trafikkdødsfall registrert i denne trekkperioden.';}
 else if(f.type==='predation'){html=predationScene(f,q,reduced());detail=f.observed===0?'Ingen gaupetap er dokumentert. Det betyr ikke nødvendigvis at ingen hjort ble tatt.':`${f.observed} gaupetap er dokumentert. Flere tap kan være uoppdaget.`;}
 else if(f.type==='winter'||f.type==='natural'){const loss=f.losses>0,fall=loss?clamp((q-.18)/.48,0,1):0;html=`<g transform="translate(325 267)"><ellipse rx="80" ry="57" fill="#f6f1df" opacity=".83"/><g transform="translate(0 ${fall*13}) rotate(${fall*82})" opacity="${1-fall*.72}">${deer(0,0,1.1,f.old?'af':'c')}</g><rect x="-109" y="-92" width="218" height="30" rx="7" fill="#faf6e7" opacity=".96"/><text x="0" y="-72" fill="#4d5e4b" font-size="16" text-anchor="middle">${f.old?'Aldersrelatert svekkelse':f.type==='winter'?'Vinterforhold':'Naturlig dødelighet'}</text></g>`;detail='Eksakt antall døde er ukjent for forvalteren.';}
 else if(f.type==='birth'){html=`<g transform="translate(645 291)"><ellipse rx="94" ry="58" fill="#f7f0d4" opacity=".82"/>${deer(-23,0,1,'af')}${f.births?`<g opacity="${q}">${deer(39,21,1,'c')}</g>`:''}</g>`;detail='Kalving i mai–juni. Én kalv per kolle som lykkes.';}
 else if(f.type==='age'){const grew=q>.48;html=`<g transform="translate(390 246)"><rect x="-168" y="-94" width="338" height="162" rx="15" fill="#fff9e6" opacity=".96"/>${deer(-99,10,1,'c')}<text x="-19" y="5" fill="#567650" font-size="30">→</text>${deer(73,10,1,grew?'ym':'c')}<text x="0" y="51" fill="#35583e" text-anchor="middle" font-size="14">Kalv → ungdyr → voksen</text></g>`;detail='Nye aldersgrupper. Ingen dødsfall i dette trinnet.';}

 else if(f.type==='browse'){html=`<g transform="translate(642 281)"><rect x="-102" y="-89" width="220" height="151" rx="12" fill="#fff7df" opacity=".94"/><path d="M-69 34v-48m-8 10 8 8 10-12m-10 4-6-14m6 20 9 7" stroke="#5c7546" stroke-width="4" fill="none"/>${deer(35,13,1,'af')}<text x="5" y="-60" text-anchor="middle" fill="#35513b" font-size="14">Innmark og skog</text></g>`;detail=`Avlingstap ${f.damage.crop} % · skadde ungtrær ${f.damage.forest} %`;}
 else{html=`<g transform="translate(459 258)"><circle r="71" fill="#fbf5df" opacity=".94"/><circle cx="-8" cy="-10" r="24" fill="none" stroke="#38614e" stroke-width="6"/><path d="m10 8 29 29" stroke="#38614e" stroke-width="8" stroke-linecap="round"/></g>`;detail='Nye data gir et nytt anslag – fortsatt med usikkerhet.';}
 layer.innerHTML=html;if($('#eventDetail'))$('#eventDetail').textContent=detail;if($('#eventProgress'))$('#eventProgress').value=time;if($('#playStatus'))$('#playStatus').textContent=playing?'Spiller · '+num(progress*100)+' %':pauseReason||'Avspillingen er på pause.';
}
function pause(reason=''){playing=false;if(raf!==null)cancelAnimationFrame(raf);raf=null;lastTick=null;if(reason)pauseReason=reason;save();}
function play(){if(game?.phase!=='play'||screen)return;if(raf!==null)cancelAnimationFrame(raf);playing=true;pauseReason='';lastTick=null;raf=requestAnimationFrame(tick);}
function tick(now){raf=null;if(!playing||game?.phase!=='play'||screen)return;if(lastTick!==null){let remaining=Math.min(200,Math.max(0,now-lastTick));while(remaining>0){const step=Math.min(remaining,20);game.elapsed=Math.min(duration(),game.elapsed+step*autoRate());remaining-=step;}}lastTick=now;paintScene();if(game.elapsed>=duration()){nextFrame(true);return;}raf=requestAnimationFrame(tick);}
function nextFrame(auto=false){if(game.phase!=='play')return;if(raf!==null)cancelAnimationFrame(raf);raf=null;lastTick=null;if(game.frame>=game.record.frames.length-1){finishYear();return;}game.frame++;game.elapsed=0;playing=auto;pauseReason=auto?'':'Neste hendelse er klar. Trykk Fortsett.';render();if(auto)raf=requestAnimationFrame(tick);}

function helpView(){return `<div class="section-head"><div><p class="kicker">Fjellvik · faggrunnlag</p><h1>Slik henger spillet sammen</h1></div>${btn('Tilbake','back','alt')}</div><section class="panel reading"><h2>Din rolle som forvalter</h2><p>Du skal begrunne en femårig bestandsplan i et fiktivt område. Begynn med datagrunnlaget, plasser tiltak og fordel jaktuttaket på dyregrupper. Spill ett år, vurder resultatet og juster neste år. Det er ingen nedtelling, og et forsøk kan spilles om med samme vær.</p><p>Bestandsmålet gjelder hjort som oppholder seg i hele Fjellvik før jakta. Det er ikke et krav om samme antall i hvert delområde hele året. En større vinterbestand lokalt kan skyldes trekk. Gaupa jakter i vinterområdene og tar først og fremst kalver og ungdyr i modellen. Ingen mål går ut på å fjerne gaupa.</p><div class="goal"><b>Målene i scenariet:</b> 240–320 hjort før jakt, sett kalv per kolle minst 0,50, sett kolle per bukk 1,2–2,5, høyst 12 % avlingstap i prøvefeltene, høyst 25 % skadde ungtrær og høyst tre trafikkdødsfall per år. Planlagt og faktisk uttak skal være rimelig i samsvar. Disse tersklene er valgt for spillet.</div><h3>Hva vet du, og hva vet modellen?</h3><p>Modellen kjenner alle dyrene den simulerer. Forvalteren ser et ufullstendig datagrunnlag: observasjoner, et usikkert anslag, jaktutbytte, skadefelt og eventuelt GPS-posisjoner. Animasjonene forklarer prosessene; de er ingen bestandstelling. Øvrig naturlig død vises ved at et dyr synker sammen og toner bort. Gaupepredasjon har en egen animasjon med en gaupe som sniker seg innpå, angriper og blir ved byttet. Ved null gaupetap passerer den uten å felle et dyr. Aldersovergangen viser at et dyr skifter gruppe, uten å dø.</p><p>Spillrapporten og notatene kan lastes ned når som helst. Etter fem år får du i tillegg åpne modellens skjulte regnskap. Da kan du sammenligne anslag og fasit.</p></section><section class="panel reading"><h2>Biologien modellen bygger på</h2><p>Hjort har vanligvis én kalv, og reproduksjonen avhenger av alder og kondisjon. I modellen bestemmes drektighet om høsten. Bare drektige koller som overlever fram til kalving, får kalv. Kalver blir ettårige ungdyr neste vår; de går ikke direkte til voksengruppen. <a href="https://hjortevilt.no/artsfakta/hjort" target="_blank" rel="noopener">Artsfakta om hjort</a>.</p><p>Hjort kan være stasjonære eller bruke ulike sommer- og vinterområder. Forskning på GPS-merkede hjort i Norge viser stor variasjon i sesongtrekk. Derfor brukes både interne ruter og utveksling med naboområdet her. <a href="https://doi.org/10.1111/j.1600-0706.2011.19439.x" target="_blank" rel="noopener">Mysterud mfl. (2011)</a>.</p><p>En norsk feltstudie fant at kalver og ettåringer dominerte blant aldersbestemte hjorter som gaupa tok om vinteren, men også voksne hjort ble tatt. Dette støtter at modellen skiller mellom aldersgrupper. Sammensetningen av byttedyrene sier ikke hvor stor andel av hjortebestanden som dør. I denne studien var gjennomsnittlig vinteruttak 2,2 hjort per 100 døgn per gaupe, med stor variasjon. De observerte hannene varierte fra 0 til 12,5 hjort per 100 vinterdøgn. Dette gjelder hjort i flere aldersklasser, ikke bare kalver. Et høyt lokalt uttak kan forekomme, men 3–4 hjortekalver per måned eller 5–15 % av kalveproduksjonen brukes ikke som et dokumentert, generelt gjennomsnitt i spillet. <a href="https://doi.org/10.1111/jzo.12088" target="_blank" rel="noopener">Gervasi mfl. (2014)</a>.</p><p>Jakt på ulike kjønn og aldersgrupper får ulike følger for framtidig produksjon, kjønnsforhold, jaktutbytte og skadepotensial. Dette er grunnen til at fem like uttak ikke nødvendigvis gir fem like resultater. <a href="https://www.nina.no/aktuelt/alle-artikler-og-nyheter/seks-strategier-for-elg-og-hjortejakta" target="_blank" rel="noopener">NINAs formidling av avskytingsstrategier</a>.</p></section><section class="panel reading"><h2>Se litt av matematikken</h2><p>Du trenger ikke regne for å spille. Regnestykkene forklarer hvorfor valgene får følger.</p><details><summary>Bestandsregnskapet</summary><p class="formula">Neste bestand = dagens bestand + fødsler − dødsfall − jakt + innvandring − utvandring</p><p>Flytting mellom Nordlia, Elvesletta og Sørskogen endrer den lokale fordelingen, men ikke summen. Kryssing av kartgrensen endrer hvor mange som er inne i Fjellvik. Et dyr kan telle som utvandret om høsten og innvandret om våren uten at det er et nytt dyr.</p></details><details><summary>Alder, sannsynlighet og kalver</summary><p>Hver kolle får en individuell sannsynlighet for drektighet. Datamaskinen trekker om hun lykkes, og følger henne gjennom vinteren. Summen av sannsynlighetene er et forventet antall – det faktiske utfallet varierer.</p><p class="formula">Forventede fødsler ≈ summen av (drektighetssannsynlighet × overlevelse fram til kalving) for kollene</p><p>I en enkel aldersmodell kan overlevelse og reproduksjon samles i en matrise som flytter bestandsvektoren ett år fram. Fjellvik følger i stedet enkeltindivider, men bruker de samme demografiske prinsippene. <a href="https://doi.org/10.1093/biomet/33.3.183" target="_blank" rel="noopener">Leslie (1945)</a> er et grunnarbeid om aldersstrukturerte matriser.</p></details><details><summary>Fra observasjon til anslag</summary><p class="formula">Anslått antall ≈ gjennomsnittlig antall oppdaget ÷ anslått oppdagbarhet</p><p>Prøveundersøkelsen teller et individ maksimalt én gang per tellenatt. Et usikkert deteksjonsanslag er oppgitt av feltlaget, og har ingen garanti for å være riktig. Med utvidet undersøkelse brukes tre netter og områdevise deteksjonsanslag.</p><p>Arbeidsintervallet utvides både for varierende antall observasjoner og usikker oppdagbarhet. Områdenes grenser summeres konservativt. Intervallet er en didaktisk konstruksjon, ikke en testet statistisk dekningssannsynlighet. GPS-kortet gir ruter; det justerer ikke bestandstallet. Diagrammet summerer bare posisjonene i individtabellen. Manglende posisjoner vises separat. Rutestatistikken bruker dyr med to kjente posisjoner, og veikryssing beregnes bare for ruter mellom områdene innenfor kartet. Et dyr med én registrert kryssingsrute er ikke én daglig veikryssing.</p><p>Jaktloggen er en annen datakilde: samme dyr kan observeres flere ganger. Sett hjort per jegerdag, sett kalv per kolle og sett kolle per bukk er indikatorer. De skal ikke behandles som en nøyaktig telling. <a href="https://www.hjorteviltregisteret.no/Statistikk/Hjort/Sett/Bestandsutvikling" target="_blank" rel="noopener">Hjorteviltregisteret</a>.</p></details></section><section class="panel reading"><h2>Valgte spillparametere og avgrensninger</h2><p><b>Dette er en læringsmodell, ikke en kalibrert prognosemodell.</b> Kildene støtter prosessene og problemstillingene. De dokumenterer ikke akkurat ratene eller tiltakseffektene nedenfor.</p><div class="table-scroll"><table><thead><tr><th>Prosess</th><th>Valgt i Fjellvik</th></tr></thead><tbody><tr><th>Drektighet</th><td>Grunnsannsynlighet 0,42 ved 1 år, 0,82 ved 2 år, 0,93 ved 3–9 år; lavere hos gamle koller. Justeres for kondisjon og bestandsbelastning. Ingen tvillingfødsler.</td></tr><tr><th>Vinterdødelighet</th><td>Før tillegg: 6,5 % for kalv, 2,4 % for ungdyr, 0,9 % for voksne koller og 1,7 % for voksne bukker. Hard vinter, mye lokal bruk og høy alder kan øke risikoen; ro og beiteskjøtsel kan redusere deler av den.</td></tr><tr><th>Sommerdødelighet</th><td>Grunnrisiko 5,5 % for kalv og 0,5 % for eldre dyr. Sommervær, bestandsbelastning og alder gir tillegg. Gaupepredasjon beregnes separat i et eget vintertrinn.</td></tr><tr><th>Gaupepredasjon</th><td>Et eget vintertrinn med grunnrisiko 12 % for kalver, 7 % for ungdyr og 0,4 % for voksne. Risikoen gjelder dyr som fortsatt er i området etter jakt og øvrige vintertap, ikke hele årets kalveproduksjon. Varierer med årets gaupeaktivitet og område. Scenariet har forhøyet lokalt gaupetrykk. Dette er valgte spillparametere, ikke dokumenterte norske tapssatser. Bare overlevende dyr kan bli tatt. Gaupetap inngår ikke i øvrig naturlig død.</td></tr><tr><th>Veikryssing</th><td>3,3 % risiko ved en modellert kryssing mellom Sørskogen og områdene nord for veien; 0,7 % med sikret passasje. Lokalt valgte demonstrasjonsrater, ikke norske gjennomsnitt.</td></tr><tr><th>Trekk og utveksling</th><td>Individer har sommer- og vinterområder. Mild vinter kan gjøre at noen blir. Både vinterbesøk og mer varig utveksling med naboområdet forekommer. Det finnes ingen fast regel om at høy tetthet alltid gir mer utvandring.</td></tr><tr><th>Beiteskader</th><td>Lokalt antall og arealtiltak styrer skadepresset. Vern av innmark reduserer avlingstap, men gir et tillegg i skogpresset. Mer skademåling gjør målingen mer presis, ikke selve skaden mindre.</td></tr><tr><th>Jakt</th><td>Antall tilgjengelige dyr og 100, 160 eller 220 jegerdager påvirker muligheten til å fylle planen. Uttaket kan aldri overstige planen eller antallet dyr i en gruppe.</td></tr><tr><th>Tilfeldige forhold</th><td>Årsvariasjon i vinter, sommer og oppdagbarhet, og individuelle utfall. Samme kampanje har samme tilfeldige grunnlag ved omspill, slik at valg kan sammenlignes.</td></tr></tbody></table></div><p>Funn av gaupedrepte hjort er ufullstendige i spillet. Hvert kadaver har 45 % sannsynlighet for å bli dokumentert, eller 90 % hvis dyret inngår i GPS-utvalget. Dette er valgte observasjonsparametere. Merkekortet gjør ikke gaupetap eller bestandstall fullstendige.</p><p>Naturlig dødelighet er forenklet. Gaupepredasjon samles i vintertrinnet for å holde årsforløpet oversiktlig. Dette utelukker ikke at gaupa kan ta hjort om sommeren i virkeligheten. Antall gauper og alternative byttedyr modelleres ikke eksplisitt. Det økte gaupetrykket er et lokalt scenario for å undersøke betydningen av tap av kalver og ungdyr; modellen beregner ikke antall hjort tatt per gaupe per måned. Modellen har ikke detaljert sykdomsspredning, mor–kalv-avhengighet ved jakt, genetikk, en full næringsmodell, virkelige arealer eller detaljert saksbehandling. Jakta samles i ett høsttrinn før brunst; i virkeligheten kan prosessene overlappe. Antall gevirtakker brukes ikke til å bestemme eksakt alder. Uttaksrammene er bevisst vide nok til å undersøke overhøsting. Du skal vurdere hvor mye av tildelingen det er forsvarlig å bruke i scenariet.</p><p>Femårsperioden passer innenfor bestandsplanreglene. I spillet følger en umiddelbar avklaring av planrevisjoner og særskilte årlige rammer. Den ordinære forvaltningen krever behandling og rapportering. <a href="https://www.landbruksdirektoratet.no/nb/jakt-og-fangst/ordninger-for-jakt-og-fangst/soke-om-godkjenning-av-vald-for-elg-hjort-eller-radyr/forskrift-om-forvaltning-av-hjortevilt-kommentarer-til-regelverk/kapittel-2.forvaltning-av-elg-hjort-og-radyr" target="_blank" rel="noopener">Landbruksdirektoratets kommentarer til hjorteviltforskriften, §§ 15–18</a> (kontrollert 9. oktober 2026).</p></section><section class="panel reading sources"><h2>Les videre</h2><p>Velg en inngang ut fra hva du vil forstå bedre. Lenker krever nettilkobling.</p><ol><li><b>Matematikken bak alder og vekst.</b> Leslie, P. H. (1945). <a href="https://doi.org/10.1093/biomet/33.3.183" target="_blank" rel="noopener">On the use of matrices in certain population mathematics</a>. <i>Biometrika</i> 33:183–212.</li><li><b>Avskyting, modellering og forvaltningsnytte.</b> Solberg, E. J., Nilsen, E. B., Rolandsen, C. M. & Veiberg, V. (2021). <a href="https://hdl.handle.net/11250/2774805" target="_blank" rel="noopener">Avskytingsstrategier for elg og hjort: Hva skal vi velge, og hva blir konsekvensene?</a> NINA Rapport 1701. Sammenholder ulike uttaksstrategier og deres følger. Se også <a href="https://www.nina.no/aktuelt/alle-artikler-og-nyheter/seks-strategier-for-elg-og-hjortejakta" target="_blank" rel="noopener">NINAs korte innføring</a>.</li><li><b>Hvor mye forteller tellingene?</b> Mysterud, A. mfl. (2007). <a href="https://doi.org/10.2981/0909-6396(2007)13%5B285:MPSORD%5D2.0.CO;2" target="_blank" rel="noopener">Monitoring population size of red deer: an evaluation of two types of census data from Norway</a>. <i>Wildlife Biology</i> 13:285–298. Undersøker jaktobservasjoner og vårtellinger mot bestandsestimater.</li><li><b>Trekk mellom årstidsområder.</b> Mysterud, A., Loe, L. E., Zimmermann, B., Bischof, R., Veiberg, V. & Meisingset, E. (2011). <a href="https://doi.org/10.1111/j.1600-0706.2011.19439.x" target="_blank" rel="noopener">Partial migration in expanding red deer populations at northern latitudes – a role for density dependence?</a> <i>Oikos</i> 120:1817–1825.</li><li><b>Beitetap som kan måles.</b> Unsgård, E. mfl. (2025; publisert elektronisk 2024). <a href="https://doi.org/10.1007/s10344-024-01880-6" target="_blank" rel="noopener">An experimental assessment of biomass loss due to red deer grazing on agricultural grass meadows in Norway</a>. <i>European Journal of Wildlife Research</i> 71, artikkel 1. Bruker inngjerdede og åpne ruter til å undersøke avlingstap.</li><li><b>Gaupa som predator på hjort.</b> Gervasi, V. mfl. (2014). <a href="https://doi.org/10.1111/jzo.12088" target="_blank" rel="noopener">The spatio-temporal distribution of wild and domestic ungulates modulates lynx kill rates in a multi-use landscape</a>. <i>Journal of Zoology</i>. Norsk feltstudie av gaupas byttevalg, årstidsforskjeller og aldersfordeling blant byttedyrene.</li><li><b>Norske indikatorer og registrering.</b> <a href="https://www.hjorteviltregisteret.no/Statistikk/Hjort" target="_blank" rel="noopener">Hjorteviltregisterets hjortestatistikk</a>, med bestandsindekser og data om tildeling og felling.</li></ol><p class="small muted">Studiene er faglig støtte. Ingen av dem validerer Fjellvik som en ferdig prognose for et bestemt norsk bestandsplanområde.</p></section><div class="actions">${btn('Tilbake til spillet','back','gold')}</div>`;}
